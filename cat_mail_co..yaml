name: Cat Mail Co.
steam_id: '4380490'
steam_folder_name: CatMailCo
gog_id: ''
nexus_id: catmailco
accent_colour: '#c1683e'
wiki_link: ''
mod_paths:
- name: BepInEx Mods
  description: The mods path for BepInEx mods
  path: '{game_path}/BepInEx/plugins'
- name: MelonLoader Mods
  description: The mods path for MelonLoader mods
  path: '{game_path}/Mods'
utilities:
- name: BepInEx
  version: 6.0.0-be.785
  creator: BepInEx
  creator_link: https://github.com/BepInEx
  source_type: direct
  source_url: https://builds.bepinex.dev/projects/bepinex_be/785/BepInEx-Unity.IL2CPP-win-x64-6.0.0-be.785%2B6abdba4.zip
  deploy_to_game_files: true
  deployment_path: /
  executable_type: non-exec
  launch_options: WINEDLLOVERRIDES='winhttp=n,b' %command%
  installation_lock_group: '1'
- name: MelonLoader
  version: Latest
  creator: Lava Gang
  creator_link: https://github.com/LavaGang
  source_type: github
  source_url: https://github.com/LavaGang/MelonLoader
  github_asset_regex: MelonLoader.x64.zip
  deploy_to_game_files: true
  deployment_path: /
  executable_type: non-exec
  launch_options: WINEDLLOVERRIDES='version=n,b' %command%
  installation_lock_group: '1'
