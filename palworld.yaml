name: Palworld
steam_id: '1623730'
steam_folder_name: ''
gog_id: ''
nexus_id: palworld
accent_colour: '#022396'
wiki_link: ''
mod_paths:
- name: Lua Mods (UE4SS installed via Steam)
  description: Mods path for Lua mods if UE4SS was installed from the Steam Workshop
  path: '{game_path}/Mods/NativeMods/UE4SS/Mods'
- name: PalSchema Mods (UE4SS installed via Steam)
  description: Mods path for PalSchema mods if UE4SS was installed from the Steam
    Workshop
  path: '{game_path}/Mods/NativeMods/UE4SS/Mods/PalSchema/mods'
- name: Pak Mods
  description: Mods path for Pak mods, this is not the same as logic pak mods
  path: '{game_path}/Pal/Content/Paks/~mods'
- name: Logic Mods
  description: Mods path for logic mods. Keep in mind these mods SHOULD include the
    LogicMods folder. If they don't you will have to manually set the deployment path
    to the LogicMods folder
  path: '{game_path}/Pal/Content/Paks'
- name: Lua Mods (UE4SS installed manually/via NOMM)
  description: Mods path for Lua mods if UE4SS was installed from the utilities tab
    in Nomm
  path: '{game_path}/Pal/Binaries/Win64/ue4ss/Mods'
- name: PalSchema Mods (UE4SS installed manually/via NOMM)
  description: Mods path for PalSchema mods if UE4SS was installed from the utilities
    tab in Nomm
  path: '{game_path}/Pal/Binaries/Win64/Mods/ue4ss/Mods/PalSchema/mods'
utilities:
- name: RE-UE4SS
  version: experimental-palworld
  creator: Okaetsu
  creator_link: https://github.com/okaetsu
  source_type: direct
  source_url: https://github.com/Okaetsu/RE-UE4SS/releases/download/experimental-palworld/UE4SS-Palworld.zip
  deploy_to_game_files: true
  deployment_path: Palword/Pal/Binaries/Win64
  executable_type: non-exec
  launch_options: WINEDLLOVERRIDES='dwmapi=n,b' %command%
