name: Abiotic Factor
steam_id: '427410'
steam_folder_name: ''
gog_id: ''
nexus_id: abioticfactor
accent_colour: '#3584e4'
wiki_link: ''
mod_paths:
- name: Paks mods
  description: Used for Paks mods, such as the 'Better Backpacks' mod
  path: '{game_path}/AbioticFactor/Content/Paks/~mods'
- name: UE4SS mods
  description: Used for UE4SS mods, such as the 'Cheat Console Commands' mod
  path: '{game_path}/AbioticFactor/Binaries/Win64/ue4ss/Mods'
utilities:
- name: UE4SS for Abiotic Factor
  version: Latest
  creator: igromanru
  creator_link: https://github.com/igromanru
  source_type: github
  source_url: https://github.com/igromanru/AF-UE4SS
  github_asset_regex: Abiotic-Factor.zip
  deploy_to_game_files: true
  deployment_path: /AbioticFactor/Binaries/Win64
  executable_type: non-exec
  launch_options: WINEDLLOVERRIDES='UE4SS=n,b;dwmapi=n,b' %command%