name: Stellar Blade
steam_id: '3489700'
steam_folder_name: ''
gog_id: ''
nexus_id: stellarblade
accent_colour: '#022396'
wiki_link: ''
mod_paths:
- name: Lua Mods
  description: Mods path for Lua mods
  path: '{game_path}/SB/Binaries/Win64/ue4ss/Mods'
- name: Paks mods
  description: Mods path for Paks mods
  path: '{game_path}/SB/Content/Paks/~mods'
- name: Logic Mods
  description: Mods path for logic mods. Keep in mind these mods SHOULD include the
    LogicMods folder. If they don't you will have to manually set the deployment path
    to the LogicMods folder
  path: '{game_path}/'
- name: Mods for Custom Nanosuit System
  description: Mods path for the mods for Custom Nanosuit System
  path: '{game_path}/SB/Content/Paks/~mods/CustomNanosuitSystem'
utilities:
- name: SB-UE4SS
  version: '1.3'
  creator: Rev-OG-UwU
  creator_link: https://github.com/Rev-OG-UwU
  source_type: direct
  source_url: https://github.com/Rev-OG-UwU/SB-UE4SS/releases/download/1.3/SB.UE4SS.1.3.zip
  deploy_to_game_files: true
  deployment_path: SB/Binaries/Win64
  executable_type: non-exec
  launch_options: WINEDLLOVERRIDES='dwmapi=n,b' %command%
